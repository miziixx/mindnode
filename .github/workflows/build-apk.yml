name: Build Debug APK

on:
  push:
    branches:
      - claude/proceed-confirmation-7htn44
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK with version
        run: cp app/build/outputs/apk/debug/app-debug.apk thoughtgraph-debug.apk

      # Artifact upload can hit the account's artifact storage quota; keep it
      # non-fatal so the Release publish below still delivers the APK.
      - name: Upload APK artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: thoughtgraph-debug-apk
          path: thoughtgraph-debug.apk
          if-no-files-found: error

      # Release assets are stored separately from Actions artifacts, so this
      # provides a direct .apk download link regardless of the artifact quota.
      - name: Publish APK to a rolling pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-latest
          name: ThoughtGraph debug APK (latest)
          prerelease: true
          files: thoughtgraph-debug.apk
