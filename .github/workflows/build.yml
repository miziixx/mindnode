name: build

on:
  push:
    branches: ["main", "claude/frequency-meditation-app-7y2qkk"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  # 순수 DSP 오프라인 검증(빌드 전 관문). 실패 시 이후 빌드 잡도 실행되지 않음.
  audio-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy
      - name: Run offline audio verification
        run: |
          cd tools/audio_verify
          python run_tests.py
      - name: Verify preset frequencies (declared vs generated vs reference)
        run: |
          cd tools/audio_verify
          python verify_presets.py
      - uses: actions/upload-artifact@v4
        with:
          name: audio-verification
          path: test_output/

  android:
    needs: audio-verify
    runs-on: ubuntu-latest
    permissions:
      contents: write # 롤링 프리릴리스에 APK 게시
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter --version
      # 플랫폼 스캐폴드 생성(lib/·pubspec·assets 는 유지됨)
      - run: flutter create --org com.mindsound --project-name mindsound --platforms=android .
      # 네이티브 오디오 엔진 오버레이 + manifest 패치
      - run: python3 tools/apply_native.py --platform android
      - run: flutter pub get
      - run: flutter analyze --no-fatal-warnings --no-fatal-infos || true
      - run: flutter test
      # 릴리스 빌드(개인 설치용). 별도 키스토어가 없으면 Flutter 기본 템플릿이
      # release 를 debug 키로 서명하므로 사이드로딩 설치가 가능하다.
      - run: flutter build apk --release
      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk mindsound-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: mindsound-release.apk
      # 로그인 없이 받을 수 있는 상시 다운로드 링크(.apk) 제공.
      # main 브랜치에서만 게시(개인용 롤링 릴리스 빌드).
      - name: Publish APK to rolling pre-release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-latest
          name: 마인드사운드 APK (릴리스·최신)
          prerelease: true
          files: mindsound-release.apk

  # 웹 빌드 + GitHub Pages 배포(gh-pages 브랜치). 프로젝트 사이트 경로 = /mindnode/.
  web:
    needs: audio-verify
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh-pages 브랜치 푸시
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      # 웹 스캐폴드 생성(lib/·pubspec·assets 유지). 웹은 네이티브 오버레이 불필요.
      - run: flutter create --org com.mindsound --project-name mindsound --platforms=web .
      - run: flutter pub get
      - run: flutter build web --release --no-wasm-dry-run --base-href /mindnode/
      # 정적 호스팅엔 커스텀 HTTP 헤더를 못 붙이므로 index.html에 CSP 메타를 주입.
      # Flutter CanvasKit(gstatic) + 우리 앱의 blob/미디어 재생까지 허용하는 정책.
      - name: Inject security headers (CSP meta)
        run: python3 tools/inject_csp.py build/web/index.html
      - name: Deploy to GitHub Pages (gh-pages)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web

  # iOS 빌드는 macOS 러너(비용 10배)라 수동 실행(workflow_dispatch)에서만 돈다.
  # GitHub Actions 분(minutes) 절약용.
  ios:
    needs: audio-verify
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create --org com.mindsound --project-name mindsound --platforms=ios .
      - run: python3 tools/apply_native.py --platform ios
      - run: flutter pub get
      - run: flutter test
      # 서명 없이 iOS 빌드(실기기 배포 아님). 실패해도 전체 워크플로는 유지.
      - run: flutter build ios --no-codesign

  # 실기기(에뮬레이터) 통합 테스트 — 앱이 실제 Android 런타임에서 부팅·렌더링되는지 확인.
  # APK 빌드(android 잡)와 독립적으로 병렬 실행되어 배포를 막지 않는다.
  android-e2e:
    needs: audio-verify
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create --org com.mindsound --project-name mindsound --platforms=android .
      - run: python3 tools/apply_native.py --platform android
      - run: flutter pub get
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run integration test on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          script: flutter test integration_test/app_boot_test.dart
